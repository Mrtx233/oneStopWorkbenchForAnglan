<!doctype html>
<!--
  UI polish adapted from unslop by Damir Sokolovsky (@heydamir), CC BY 4.0.
  https://github.com/heydamir/unslop — dark palette and review workflow retained.
  Changes: spacing, typography, action hierarchy, responsive layout and focus states.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品颜色识别与复核</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315; --panel: #191c20; --inset: #15181b; --hover: #23272c;
      --line: #30353a; --line-soft: #282d32;
      --text: #eceef0; --muted: #abb1b7; --quiet: #899198;
      --gold: #dfbc70; --selection: #29271f;
      --green: #94bca5; --blue: #a0b9d3; --red: #d6a29a;
      --radius: 8px; --ease: 150ms ease;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    button, input, select, summary { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; font-weight: 500; }
    button, input, select { transition: background-color var(--ease), border-color var(--ease), color var(--ease); }
    .app { height: 100vh; height: 100dvh; min-height: 660px; display: grid; grid-template-columns: 248px minmax(0, 1fr) 304px; gap: 12px; padding: 16px; }
    .panel { min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; }
    .products, .colors, .work { display: flex; flex-direction: column; }
    .head { padding: 20px 16px 16px; border-bottom: 1px solid var(--line-soft); }
    .head h1, .head h2 { font-size: 16px; line-height: 1.5; letter-spacing: .02em; }
    .eyebrow { display: block; margin-bottom: 8px; color: var(--quiet); font-size: 11px; letter-spacing: .1em; }
    .muted { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .stat-total { display: block; margin-bottom: 4px; color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }
    .stat-detail { display: block; line-height: 1.8; font-variant-numeric: tabular-nums; }
    .filters { display: grid; gap: 8px; padding: 16px 12px 12px; }
    .search, .filter { width: 100%; min-width: 0; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--inset); color: var(--text); font-size: 12px; }
    .search::placeholder { color: var(--quiet); }
    .list-label { padding: 0 16px 8px; color: var(--quiet); font-size: 11px; }
    .product-list, .color-list { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #454b52 transparent; }
    .product-list { padding: 0 8px 12px; }
    .product { position: relative; width: 100%; display: block; text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--radius); color: var(--text); padding: 12px; margin-bottom: 4px; }
    .product:hover { background: var(--hover); }
    .product.active { background: var(--selection); border-color: #63553a; }
    .product-title { font-size: 13px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-meta { color: var(--quiet); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-tags { display: flex; gap: 4px 12px; flex-wrap: wrap; margin-top: 8px; }
    .tag { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .tag.auto_success { color: var(--blue); }
    .tag.auto_failed { color: var(--red); }
    .tag.manual_done { color: var(--green); }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--line-soft); color: var(--quiet); font-size: 11px; }
    .toolbar { padding: 20px 20px 16px; border-bottom: 1px solid var(--line-soft); }
    .product-heading { min-width: 0; }
    .product-heading h2 { font-size: 20px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-heading .muted { margin-top: 4px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .toolbar-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .toolbar-actions, .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .button, .small { min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 12px; line-height: 20px; white-space: nowrap; }
    .button:hover:not(:disabled), .small:hover:not(:disabled) { background: var(--hover); border-color: #515961; }
    .button.primary { background: #e2e4e5; border-color: #e2e4e5; color: #191c20; font-weight: 500; }
    .button.primary:hover:not(:disabled) { background: #fff; border-color: #fff; }
    .button.quiet { color: var(--muted); border-color: transparent; }
    .small { padding: 3px 10px; min-height: 28px; line-height: 20px; }
    .small.choose[aria-pressed="true"] { border-color: #756441; color: var(--gold); background: var(--selection); }
    .small.clear { margin-left: auto; color: var(--quiet); border-color: transparent; }
    .small.clear:hover:not(:disabled) { color: var(--red); }
    .recognition-bar { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
    .job { margin-top: 8px; font-size: 12px; color: var(--quiet); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .job.error { color: var(--red); }
    progress { display: block; width: 100%; height: 4px; margin: 12px 0 0; accent-color: var(--gold); border: 0; border-radius: 4px; overflow: hidden; }
    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value { background: var(--gold); }
    .notice { padding: 12px 20px; min-height: 44px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .notice[data-tone="error"] { color: var(--red); }
    .notice[data-tone="success"] { color: var(--green); }
    .sheet-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 16px 20px 0; font-size: 12px; }
    .sheet-heading h3 { font-size: 12px; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--quiet); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border: 1px solid var(--blue); border-radius: 2px; }
    .legend .manual { border-color: var(--green); }
    .legend .candidate { border-color: var(--gold); border-style: dashed; }
    .sheet-scroll { flex: 1; min-height: 200px; overflow: auto; padding: 16px 20px 20px; scrollbar-width: thin; scrollbar-color: #454b52 transparent; }
    .sheet { position: relative; width: 100%; min-width: 600px; max-width: 1400px; margin: 0 auto; line-height: 0; overflow: hidden; border-radius: 4px; background: var(--inset); }
    .sheet img { display: block; width: 100%; height: auto; }
    .hit-layer { position: absolute; inset: 0; }
    .hit { position: absolute; padding: 0; border: 0; background: transparent; border-radius: 0; }
    .hit.auto { outline: 2px solid var(--blue); outline-offset: -2px; }
    .hit.manual { outline: 2px solid var(--green); outline-offset: -2px; }
    .hit.suggested { outline: 2px dashed var(--gold); outline-offset: -3px; }
    .hit.selected { outline: 3px solid var(--gold); outline-offset: -3px; }
    .hit:hover:not(:disabled), .hit:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; background: #dfbc7014; }
    .cell-label { position: absolute; left: 4px; right: 4px; bottom: 4px; width: fit-content; max-width: calc(100% - 8px); background: #17191cef; color: var(--text); font-size: 11px; line-height: 1.5; padding: 2px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-radius: 4px; }
    .empty { min-height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 8px; text-align: center; padding: 24px; color: var(--muted); background: var(--inset); border-radius: var(--radius); }
    .empty strong { font-weight: 500; color: var(--text); }
    .empty p { font-size: 12px; }
    .sheet-footer { padding: 12px 20px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .sheet-footer .scroll-hint { display: block; color: var(--quiet); font-size: 11px; margin-top: 4px; }
    .color-list { padding: 12px; }
    .color-card { padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--inset); }
    .color-card:last-child { margin-bottom: 0; }
    .color-card.active { border-color: var(--gold); background: #1e1e1b; }
    .color-row { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .color-name { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
    .color-translation { margin-top: 2px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .image-number { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .color-card.active .image-number { color: var(--gold); }
    .status-label { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .status-label.auto_success { color: var(--blue); }
    .status-label.auto_failed { color: var(--red); }
    .status-label.manual_done, .status-label.auto_confirmed { color: var(--green); }
    .reason { font-size: 12px; color: var(--muted); margin-top: 12px; overflow-wrap: anywhere; }
    .metrics { color: var(--quiet); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .value { margin: 12px 0; color: var(--quiet); font-size: 11px; overflow-wrap: anywhere; }
    details summary { width: fit-content; cursor: pointer; }
    details[open] summary { margin-bottom: 8px; }
    .color-footer { padding: 16px; border-top: 1px solid var(--line-soft); color: var(--quiet); font-size: 11px; line-height: 1.8; }
    .color-footer details { margin-top: 8px; }
    .path { overflow-wrap: anywhere; }
    .empty-list { padding: 16px 8px; color: var(--muted); font-size: 12px; }
    @media (max-width: 1199px) {
      .app { height: auto; min-height: 100vh; grid-template-columns: 216px minmax(0, 1fr); grid-template-rows: minmax(660px, calc(100dvh - 32px)) auto; }
      .colors { grid-column: 1 / -1; }
      .color-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; gap: 12px; overflow: visible; }
      .color-card { margin-bottom: 0; }
      .color-footer { padding: 12px 16px; }
    }
    @media (max-width: 820px) {
      .app { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
      .head { padding: 16px; }
      .products .head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .products .eyebrow { display: none; }
      .products .head h1 { font-size: 14px; max-width: 120px; }
      .products .muted { margin-top: 0; text-align: right; }
      .stat-total { margin-bottom: 0; }
      .stat-detail { font-size: 11px; }
      .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 12px; }
      .list-label, .sidebar-footer { display: none; }
      .product-list { max-height: 128px; flex: auto; padding-bottom: 8px; }
      .product { padding: 8px 12px; }
      .product-meta { display: none; }
      .product-tags { margin-top: 4px; }
      .work { min-height: 640px; }
      .toolbar { padding: 16px; }
      .product-heading h2 { font-size: 18px; }
      .recognition-bar { padding: 12px 16px; }
      .notice { padding: 12px 16px; }
      .sheet-heading { padding: 16px 16px 0; }
      .sheet-scroll { flex: auto; padding: 12px 16px 16px; max-height: 540px; }
      .sheet { min-width: 720px; }
      .sheet-footer { padding: 12px 16px; }
      .button { min-height: 40px; }
      .small { min-height: 36px; }
      .color-list { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel products" aria-label="商品列表">
      <div class="head">
        <div><span class="eyebrow">LOCAL COLOR REVIEW</span><h1>商品颜色识别与复核</h1></div>
        <div class="muted" id="stats">正在读取…</div>
      </div>
      <div class="filters">
        <input id="search" class="search" type="search" placeholder="搜索商品名 / MD5" aria-label="搜索商品名或 MD5" autocomplete="off">
        <select id="filter" class="filter" aria-label="按识别状态筛选">
          <option value="all">全部商品</option><option value="review">需要人工复核</option>
          <option value="auto">自动识别 · 待确认</option><option value="failed">识别未成功</option>
          <option value="pending">尚未识别 / 未绑定</option><option value="manual">人工已确认 / 已调整</option>
        </select>
      </div>
      <div class="list-label" id="listCount">商品列表</div>
      <div class="product-list" id="products"></div>
      <div class="sidebar-footer">本地处理 · 原始 JSON 保留</div>
    </aside>
    <main class="panel work">
      <div class="toolbar">
        <div class="product-heading"><h2 id="title">选择商品</h2><div class="muted" id="subtitle"></div></div>
        <div class="toolbar-bottom">
          <nav class="toolbar-actions" aria-label="切换商品">
            <button class="button" id="prev">上一个</button><button class="button" id="next">下一个</button>
            <button class="button quiet" id="nextReview">下个待复核</button>
          </nav>
          <button class="button quiet" id="save" disabled>保存 JSON</button>
        </div>
      </div>
      <div class="recognition-bar">
        <div class="actions">
          <button class="button primary" id="recognizeAll" disabled>本地识别全部</button>
          <button class="button" id="recognizeOne" disabled>识别当前商品</button>
          <button class="button quiet" id="confirmAll" disabled>确认本商品结果</button>
        </div>
        <div class="job" id="job">仅处理未确认颜色，保留人工结果。</div>
        <progress id="progress" max="1" value="0" aria-label="本地识别进度" hidden></progress>
      </div>
      <div class="notice" id="saveState" role="status" aria-live="polite">选颜色，再点击对应图片；每次修改自动保存。</div>
      <div class="sheet-heading">
        <h3>商品图片</h3>
        <div class="legend" aria-label="图片标记说明"><span><i></i>自动</span><span><i class="manual"></i>人工确认</span><span><i class="candidate"></i>候选</span></div>
      </div>
      <div class="sheet-scroll" id="sheetArea"><div class="empty"><strong>选择商品开始复核</strong><p>运行本地识别，或选择颜色后直接点击图片。</p></div></div>
      <div class="sheet-footer" id="sheetFooter">图片编号对应原 JSON 的 images 索引。</div>
    </main>
    <aside class="panel colors" aria-label="颜色选项">
      <div class="head"><h2>JSON 颜色选项</h2><div class="muted" id="colorHint">选择商品后查看颜色</div></div>
      <div class="color-list" id="colorList"></div>
      <div class="color-footer">
        自动成功结果写入输出 JSON；未成功的候选保留空值，需人工确认。
        <details><summary>当前输出文件</summary><div class="path" id="outputPath"></div></details>
      </div>
    </aside>
  </div>
  <script>
    let state = null, currentId = null, activeColor = null, query = '';
    let busy = false, loading = false, refreshChain = Promise.resolve();
    const el = id => document.getElementById(id);
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    // Display translations only; API payloads always keep the original color key.
    const COLOR_ZH = Object.freeze({
      'black': '黑色', 'white': '白色', 'ivory': '象牙白', 'off white': '米白色',
      'cream': '奶油色', 'beige': '米色', 'apricot': '杏色', 'champagne': '香槟色', 'sand': '沙色',
      'gray': '灰色', 'light gray': '浅灰色', 'dark gray': '深灰色', 'charcoal': '炭灰色',
      'silver': '银色', 'ash': '烟灰色', 'brown': '棕色', 'dark brown': '深棕色',
      'chocolate brown': '巧克力棕', 'coffee': '咖啡色', 'camel': '驼色', 'khaki': '卡其色',
      'taupe': '灰褐色', 'red': '红色', 'dark red': '深红色', 'burgundy': '勃艮第酒红',
      'wine red': '酒红色', 'claret': '深酒红色', 'pink': '粉色', 'light pink': '浅粉色',
      'dusty pink': '灰粉色', 'dusty rose': '烟玫瑰色', 'blush pink': '腮红粉',
      'rose': '玫瑰色', 'rose red': '玫红色', 'fuchsia': '紫红色', 'peach': '蜜桃色',
      'orange': '橙色', 'yellow': '黄色', 'mustard': '芥末黄', 'gold': '金色',
      'purple': '紫色', 'light purple': '浅紫色', 'lavender': '薰衣草紫', 'plum': '梅紫色',
      'blue': '蓝色', 'light blue': '浅蓝色', 'sky blue': '天蓝色', 'dark blue': '深蓝色',
      'navy blue': '藏青色', 'royal blue': '宝蓝色', 'dusty blue': '灰蓝色',
      'cyan': '青色', 'teal': '蓝绿色', 'deep teal': '深蓝绿色', 'peacock blue': '孔雀蓝',
      'green': '绿色', 'light green': '浅绿色', 'dark green': '深绿色', 'sage green': '鼠尾草绿',
      'olive': '橄榄绿', 'army green': '军绿色', 'bean green': '豆绿色', 'emerald': '祖母绿',
      'grey': '灰色', 'light grey': '浅灰色', 'dark grey': '深灰色', 'navy': '藏青色',
      'navyblue': '藏青色', 'deep blue': '深蓝色', 'lightblue': '浅蓝色', 'wine': '酒红色',
      'pure white': '纯白色', 'jet black': '乌黑色', 'offwhite': '米白色', 'heather gray': '麻灰色',
      'heather grey': '麻灰色', 'olive green': '橄榄绿', 'sage': '鼠尾草绿', 'blush': '腮红粉',
      'chocolate': '巧克力色', 'caramel': '焦糖色', 'rust': '铁锈色', 'terracotta': '陶土色',
      'coral': '珊瑚色', 'mint': '薄荷绿', 'mint green': '薄荷绿', 'turquoise': '绿松石色',
      'aqua': '水蓝色', 'lilac': '丁香紫', 'mauve': '藕紫色', 'violet': '紫罗兰色',
      'lemon yellow': '柠檬黄', 'rose gold': '玫瑰金', 'denim blue': '牛仔蓝',
      'multicolor': '彩色', 'multicolour': '彩色', 'multi color': '彩色',
      'multi colour': '彩色', 'colorful': '彩色', 'colourful': '彩色',
      'floral': '碎花', 'leopard': '豹纹', 'plaid': '格纹', 'striped': '条纹', 'stripes': '条纹'
    });
    function colorTranslation(name) {
      const text = String(name ?? '').trim();
      if (!text || /[\u3400-\u9fff]/.test(text)) return '';
      const key = text.toLowerCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
      if (Object.prototype.hasOwnProperty.call(COLOR_ZH, key)) return COLOR_ZH[key];
      const thickness = key.match(/^(.+?)\s*\((normal|winter) thickness\)$/);
      if (thickness) {
        const base = colorTranslation(thickness[1]);
        return base ? base + (thickness[2] === 'winter' ? '（冬款厚度）' : '（常规厚度）') : '';
      }
      const pattern = key.match(/^(.+?)\s+(stripe|stripes|striped|floral|leopard|plaid)$/);
      if (pattern) {
        const base = colorTranslation(pattern[1]);
        return base ? base + ({stripe: '条纹', stripes: '条纹', striped: '条纹', floral: '碎花', leopard: '豹纹', plaid: '格纹'}[pattern[2]]) : '';
      }
      const parts = key.split(/\s*(?:[/&+]|\band\b)\s*/);
      if (parts.length > 1) {
        const translated = parts.map(colorTranslation);
        return translated.every(Boolean) ? translated.join(' / ') : '';
      }
      return '';
    }
    function colorLabel(name) {
      const translation = colorTranslation(name);
      return translation ? name + ' · ' + translation : name;
    }

    function notice(text, tone = '') {
      el('saveState').textContent = text;
      el('saveState').dataset.tone = tone;
    }
    async function request(path, body) {
      const options = body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)};
      const response = await fetch(path, options);
      const result = await response.json();
      if (!response.ok) throw Error(result.error || response.statusText);
      return result;
    }
    function selected() { return state?.products.find(p => p.id === currentId); }
    function count(p, key) { return p.counts[key] || 0; }
    function visibleProducts() {
      return (state?.products || []).filter(p => {
        if (query && !(p.title + ' ' + p.md5).toLowerCase().includes(query)) return false;
        switch (el('filter').value) {
          case 'review': return p.review_count > 0;
          case 'auto': return count(p, 'auto_success') > 0;
          case 'failed': return count(p, 'auto_failed') > 0;
          case 'pending': return p.pending > 0;
          case 'manual': return count(p, 'manual_done') + count(p, 'auto_confirmed') > 0;
          default: return true;
        }
      });
    }
    function tags(p) {
      const pieces = [];
      if (count(p, 'auto_success')) pieces.push('<span class="tag auto_success">待确认 ' + count(p, 'auto_success') + '</span>');
      if (count(p, 'auto_failed')) pieces.push('<span class="tag auto_failed">未成功 ' + count(p, 'auto_failed') + '</span>');
      const manual = count(p, 'manual_done') + count(p, 'auto_confirmed');
      if (manual) pieces.push('<span class="tag manual_done">人工完成 ' + manual + '</span>');
      const pending = count(p, 'pending') + count(p, 'manual_pending');
      if (pending) pieces.push('<span class="tag">未绑定 ' + pending + '</span>');
      return pieces.join('') || '<span class="tag">' + (p.colors.length ? '原有链接' : '无颜色选项') + '</span>';
    }
    function renderList() {
      const box = el('products'), scroll = box.scrollTop;
      box.replaceChildren();
      if (!state) return;
      const visible = visibleProducts();
      for (const p of visible) {
        const button = document.createElement('button');
        button.className = 'product' + (p.id === currentId ? ' active' : '');
        button.setAttribute('aria-pressed', String(p.id === currentId));
        button.title = p.title || '(无标题)';
        button.innerHTML = '<div class="product-title">' + esc(p.title || '(无标题)') + '</div><div class="product-meta">' + esc(p.md5 || '无 MD5') + '</div><div class="product-tags">' + tags(p) + '</div>';
        button.onclick = () => { currentId = p.id; activeColor = null; render(); };
        box.append(button);
      }
      if (!visible.length) box.innerHTML = '<div class="empty-list">没有符合条件的商品，可调整搜索或筛选。</div>';
      box.scrollTop = scroll;
      el('listCount').textContent = '商品列表 · ' + visible.length;
      const t = state.totals;
      el('stats').innerHTML = '<span class="stat-total">' + state.products.length + ' 个商品</span><span class="stat-detail">待确认 ' + (t.auto_success || 0) + ' · 未成功 ' + (t.auto_failed || 0) + '<br>人工完成 ' + ((t.manual_done || 0) + (t.auto_confirmed || 0)) + ' 色</span>';
    }
    function selectColor(name) {
      if (busy) return;
      activeColor = name;
      renderColors(selected()); renderSheet(selected()); renderJob();
      notice('已选择 ' + colorLabel(name) + '，点击对应图片即可绑定并自动保存。');
    }
    function renderColors(p) {
      const box = el('colorList'), scroll = box.scrollTop;
      const expanded = new Set([...box.querySelectorAll('.color-card')].filter(card => card.querySelector('details')?.open).map(card => card.dataset.color));
      box.replaceChildren();
      el('colorHint').textContent = p.error || p.colors.length + ' 个颜色 · ' + p.review_count + ' 项待复核';
      if (!p.colors.length) { box.innerHTML = '<div class="empty-list">该商品没有可编辑的 Color 对象。</div>'; return; }
      for (const c of p.colors) {
        const card = document.createElement('section'), d = c.detection || {};
        card.className = 'color-card' + (activeColor === c.name ? ' active' : '');
        card.dataset.color = c.name;
        card.setAttribute('aria-label', colorLabel(c.name));
        const translation = colorTranslation(c.name);
        let extra = '';
        if (d.reason) extra += '<div class="reason">' + (['manual_done', 'auto_confirmed', 'manual_pending'].includes(c.status) ? '此前识别：' : '') + esc(d.reason) + '</div>';
        if (Number.isInteger(d.image_index)) extra += '<div class="metrics">候选 #' + d.image_index + (Number.isFinite(d.delta_e) ? ' · 色差 ' + d.delta_e : '') + (Number.isFinite(d.margin) ? ' · 区分度 ' + d.margin : '') + '</div>';
        card.innerHTML = '<div class="color-row"><div><h3 class="color-name">' + esc(c.name) + '</h3>' + (translation ? '<div class="color-translation">' + esc(translation) + '</div>' : '') + '</div><span class="image-number">' + (Number.isInteger(c.assigned_index) ? '#' + c.assigned_index : '—') + '</span></div><div class="status-label ' + esc(c.status) + '">' + esc(c.status_label) + '</div>' + extra + '<details class="value"><summary>' + (c.url ? '已绑定 URL' : '尚未绑定图片') + '</summary>' + esc(c.url || '未成功的候选不会写入 JSON') + '</details><div class="actions"><button class="small choose" aria-pressed="' + (activeColor === c.name) + '">' + (activeColor === c.name ? '正在选图' : (c.url ? '调整图片' : '选择图片')) + '</button>' + (c.status === 'auto_success' ? '<button class="small confirm">确认识别</button>' : '') + (c.status === 'auto_failed' && Number.isInteger(d.image_index) ? '<button class="small accept">采用候选</button>' : '') + (c.url ? '<button class="small clear">清除</button>' : '') + '</div>';
        card.querySelector('details').open = expanded.has(c.name);
        card.querySelector('.choose').onclick = () => selectColor(c.name);
        card.querySelector('.confirm')?.addEventListener('click', () => confirm(c.name));
        card.querySelector('.accept')?.addEventListener('click', () => assign(d.image_index, c.name));
        card.querySelector('.clear')?.addEventListener('click', () => assign(null, c.name));
        box.append(card);
      }
      box.scrollTop = scroll;
    }
    function renderSheet(p) {
      const area = el('sheetArea'), top = area.scrollTop, left = area.scrollLeft;
      area.replaceChildren();
      if (!p?.sheet_url || !p.cells.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = p ? (p.sheet_error || '该商品没有可用拼图，请检查图片目录。') : '暂无商品，请检查输入 JSON。';
        area.append(empty);
        el('sheetFooter').textContent = '图片编号对应原 JSON 的 images 索引。';
        return;
      }
      const frame = document.createElement('div'), image = document.createElement('img'), layer = document.createElement('div');
      frame.className = 'sheet'; image.src = p.sheet_url; image.alt = '商品图片编号拼图'; image.draggable = false; layer.className = 'hit-layer';
      const active = p.colors.find(c => c.name === activeColor);
      for (const cell of p.cells) {
        const hit = document.createElement('button');
        const owners = p.colors.filter(c => c.assigned_index === cell.image_index), owner = owners[0];
        const suggested = active?.status === 'auto_failed' && active.detection?.image_index === cell.image_index;
        hit.className = 'hit' + (owner ? (owner.status === 'auto_success' ? ' auto' : owner.status === 'existing' ? '' : ' manual') : '') + (suggested ? ' suggested' : '') + (owners.some(c => c.name === activeColor) ? ' selected' : '');
        Object.assign(hit.style, {left: cell.left + '%', top: cell.top + '%', width: cell.width + '%', height: cell.height + '%'});
        hit.title = '图片 ' + cell.image_index + (owners.length ? ' · ' + owners.map(c => colorLabel(c.name) + ' · ' + c.status_label).join('；') : '');
        hit.setAttribute('aria-label', hit.title);
        if (owner) {
          const label = document.createElement('span');
          label.className = 'cell-label';
          label.textContent = owners.map(c => colorLabel(c.name)).join(' / ') + ' · ' + (owner.status === 'auto_success' ? '自动' : owner.status === 'existing' ? '原有链接' : '人工确认');
          hit.append(label);
        }
        hit.onclick = () => activeColor === null ? notice('先在颜色选项中选择颜色，再点击对应图片。') : assign(cell.image_index, activeColor);
        layer.append(hit);
      }
      frame.append(image, layer); area.append(frame);
      area.scrollTop = top; area.scrollLeft = left;
      image.onerror = () => {
        if (!frame.isConnected) return;
        area.innerHTML = '<div class="empty">拼图读取失败，请检查图片目录后刷新。</div>';
        el('sheetFooter').textContent = '拼图不可用，暂时无法点击选图。';
      };
      el('sheetFooter').innerHTML = p.cells.length + ' 张图片 · ' + (activeColor === null ? '先选颜色，再点图片' : '当前颜色：' + esc(colorLabel(activeColor))) + '<span class="scroll-hint">编号对应原 images 索引 · 图片区可横向滚动</span>';
    }
    function renderJob() {
      const p = selected(), j = state?.job;
      el('recognizeAll').disabled = !state || !state.products.length || busy || j.running;
      el('recognizeOne').disabled = !p?.colors.length || busy || j?.running;
      el('confirmAll').disabled = busy || !p?.colors.some(c => c.status === 'auto_success');
      el('save').disabled = !state || busy;
      el('prev').disabled = el('next').disabled = !visibleProducts().length;
      el('nextReview').disabled = !state?.products.some(p => p.review_count > 0);
      document.querySelectorAll('#colorList button, .hit').forEach(button => { button.disabled = busy; });
      el('colorList').setAttribute('aria-busy', String(busy));
      if (!j) return;
      el('progress').hidden = !j.running; el('progress').max = Math.max(j.total, 1); el('progress').value = j.completed;
      el('job').classList.toggle('error', Boolean(j.error));
      el('job').textContent = j.error || (j.running ? '正在识别 ' + j.completed + ' / ' + j.total + ' · ' + j.current : j.total ? '识别完成 ' + j.completed + ' / ' + j.total + ' · 用时 ' + j.elapsed + ' 秒' : '仅处理未确认颜色，保留人工标注、人工确认和人工清除。');
    }
    function render() {
      renderList(); el('outputPath').textContent = state?.output || '';
      const p = selected();
      el('title').textContent = p ? (p.title || '(无标题)') : '选择商品';
      el('title').title = p?.title || '';
      el('subtitle').textContent = p ? 'MD5 ' + p.md5 + ' · ' + p.image_count + ' 张原始图片' : '';
      if (p) renderColors(p);
      else { el('colorList').replaceChildren(); el('colorHint').textContent = '暂无可编辑颜色'; }
      renderSheet(p); renderJob();
    }
    function reload(keep) {
      const task = refreshChain.catch(() => {}).then(async () => {
        loading = true;
        try {
          const oldRunning = state?.job.running;
          state = await request('/api/state');
          if (keep !== undefined && state.products.some(p => p.id === keep)) currentId = keep;
          else if (!state.products.some(p => p.id === currentId)) { currentId = state.products[0]?.id ?? null; activeColor = null; }
          render();
          if (oldRunning && !state.job.running) notice(state.job.error || '识别完成，可筛选待复核商品，逐项确认或调整。', state.job.error ? 'error' : 'success');
        } finally { loading = false; }
      });
      refreshChain = task; return task;
    }
    async function mutate(path, payload, message) {
      if (busy) return;
      busy = true; renderJob(); notice('正在保存…');
      try { await request(path, payload); activeColor = null; await reload(); notice(message, 'success'); }
      catch (error) { notice(error.message, 'error'); }
      finally { busy = false; renderJob(); }
    }
    function assign(index, color) { const p = selected(); if (p) mutate('/api/assign', {id: p.id, color, image_index: index}, '已自动保存，人工调整已记录。'); }
    function confirm(color) { const p = selected(); if (p) mutate('/api/confirm', {id: p.id, ...(color === null ? {} : {color})}, '已人工确认并保存。'); }
    async function recognize(all) {
      if (busy) return;
      busy = true; renderJob();
      try {
        await request('/api/recognize', all ? {} : {id: currentId}); await reload();
        notice(state.job.total ? '识别已启动，可同时人工标注；人工结果优先。' : '没有待识别颜色，已有人工结果会保留。');
      } catch (error) { notice(error.message, 'error'); }
      finally { busy = false; renderJob(); }
    }
    function move(delta, reviewOnly = false) {
      const list = reviewOnly ? (state?.products || []).filter(p => p.review_count > 0) : visibleProducts();
      if (!list.length) { notice('没有符合条件的商品。'); return; }
      const i = list.findIndex(p => p.id === currentId);
      currentId = list[(i + delta + list.length) % list.length].id; activeColor = null; render();
    }
    el('search').oninput = event => { query = event.target.value.trim().toLowerCase(); renderList(); renderJob(); };
    el('filter').onchange = () => { renderList(); renderJob(); };
    el('prev').onclick = () => move(-1); el('next').onclick = () => move(1); el('nextReview').onclick = () => move(1, true);
    el('recognizeAll').onclick = () => recognize(true); el('recognizeOne').onclick = () => recognize(false);
    el('confirmAll').onclick = () => confirm(null); el('save').onclick = () => mutate('/api/save', {}, '已保存 JSON 和识别复核进度。');
    renderJob();
    reload().catch(error => notice('读取失败：' + error.message, 'error'));
    setInterval(() => { if (state?.job.running && !busy && !loading) reload().catch(error => notice(error.message, 'error')); }, 1500);
  </script>
</body>
</html>
